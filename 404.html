<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Página no encontrada · Tres Pistas Lab</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#102040">
<link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon.png">
<style>
@font-face{font-family:'Archivo';font-weight:800;font-display:swap;
  src:url('/fonts/archivo-latin-800-normal.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-weight:400;font-display:swap;
  src:url('/fonts/ibm-plex-sans-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:600;font-display:swap;
  src:url('/fonts/ibm-plex-mono-latin-600-normal.woff2') format('woff2')}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#102040;color:#fff;display:grid;place-items:center;
  font:17px/1.55 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
main{max-width:520px}
.marca{font:800 20px/1 'Archivo','Helvetica Neue',Arial,sans-serif;letter-spacing:-.01em}
.marca i{font-style:normal;color:#F0792B}
.cod{font:600 12px/1 'IBM Plex Mono',ui-monospace,Menlo,monospace;letter-spacing:.14em;
  text-transform:uppercase;color:#F0792B;margin:44px 0 12px}
h1{font:800 clamp(32px,7vw,52px)/1.04 'Archivo','Helvetica Neue',Arial,sans-serif;
  letter-spacing:-.025em;margin:0 0 16px;text-wrap:balance}
p{margin:0 0 26px;color:#B9C6DA}
.fila{display:flex;gap:10px;flex-wrap:wrap}
a{display:inline-flex;align-items:center;font-weight:600;font-size:15px;text-decoration:none;
  padding:13px 19px;border-radius:11px;background:#E06010;color:#fff}
a.b{background:transparent;border:1.5px solid rgba(255,255,255,.28)}
a:focus-visible{outline:2px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="marca">TRES<i>PISTAS</i>LAB</div>
  <p class="cod">Error 404 · fuera de banda</p>
  <h1>Esta jugada no está en el vídeo</h1>
  <p>La página que buscas no existe o ha cambiado de sitio. Desde la portada se llega
    a todo: los planes, las instalaciones, la app y la maqueta 3D.</p>
  <div class="fila">
    <a href="/">Volver a la portada</a>
    <a class="b" href="/maqueta/">Abrir la maqueta 3D</a>
  </div>
</main>
</body>
</html>
